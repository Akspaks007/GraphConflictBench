[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "graphconflictbench"
version = "0.1.0"
description = "Verified paired graph-conflict datasets and a native LightRAG integration"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7", "tiktoken>=0.7,<1", "python-dotenv>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
models = ["openai>=2,<4", "numpy>=1.24,<3"]
gemini = ["httpx>=0.28,<1", "numpy>=1.24,<3"]

[project.scripts]
graphconflictbench = "graphconflictbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["native: executes the installed official LightRAG SDK"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

